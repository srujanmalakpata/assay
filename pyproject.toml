[project]
name = "assay"
version = "1.0.0"
description = "Python test-automation framework (pytest, Playwright, Selenium, Locust) around a small FastAPI bookshop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-html>=4.1",
    "pytest-playwright>=0.7",
    "playwright==1.56.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "hypothesis>=6.112",
    "selenium>=4.25",
    "locust>=2.31",
    "axe-playwright-python>=0.1.4",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test-results", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # pytest-playwright: keep evidence only for failing UI tests.
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--output=test-results/playwright",
]
markers = [
    "smoke: fast, critical-path checks run on every change",
    "regression: broader behavioural coverage",
    "unit: pure-Python tests that need no running server",
    "api: REST API tests over HTTP (httpx)",
    "contract: JSON Schema response-contract tests",
    "property: Hypothesis property-based tests",
    "db: assertions on persisted SQLite state",
    "ui: Playwright browser tests (Page Object Model)",
    "a11y: axe-core accessibility scans",
    "selenium: Selenium WebDriver variants (opt-in: -m selenium)",
]
xfail_strict = true
junit_family = "xunit2"
